services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: f1bot
      POSTGRES_USER: f1bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "f1bot"]
      interval: 5s
      retries: 5

  bot:
    image: f1-bot:prod
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    # LINE webhook. Loopback only: an HTTPS reverse proxy on the host forwards to it.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      F1BOT_DATABASE_URL: postgresql://f1bot:${POSTGRES_PASSWORD}@postgres:5432/f1bot

volumes:
  pgdata18:
