services:
  postgres:
    container_name: mango_pg
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mango
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
    network_mode: host
    command: ["postgres", "-c", "port=31055"]
    volumes:
      # PG 18 moved PGDATA to /var/lib/postgresql/<major>/docker, so the mount
      # goes one level up at /var/lib/postgresql. Mounting the old
      # .../data path makes the 18 image refuse to start ("PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)"). The extra level is
      # also what lets `pg_upgrade --link` work without crossing a mount
      # boundary. See docker-library/postgres#37.
      - mango_pgdata:/var/lib/postgresql

volumes:
  mango_pgdata:
