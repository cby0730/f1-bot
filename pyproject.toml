[project]
name = "f1-bot"
version = "0.3.1"
description = "Your pocket pit wall — a Telegram bot for Formula 1 schedules, results, and standings"
readme = "README.md"
authors = [
    { name = "Billy", email = "billy@local" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg~=0.30",
    "httpx~=0.28",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "python-telegram-bot[job-queue]~=22.0",
    "structlog~=25.0",
]

[project.urls]
Homepage = "https://github.com/cby0730/f1-bot"
Repository = "https://github.com/cby0730/f1-bot"

[project.scripts]
f1-bot = "f1_bot:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pre-commit-hooks>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.35.0",
    "ruff~=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration test marker",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".agents"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S108"]
