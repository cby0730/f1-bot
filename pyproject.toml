[project]
name = "f1-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "billy", email = "billy@local" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite~=0.21",
    "httpx~=0.28",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "python-telegram-bot[job-queue]~=22.0",
    "structlog~=25.0",
]

[project.scripts]
f1-bot = "f1_bot:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "pytest-cov>=7.1.0",
    "pytest-httpx~=0.35",
    "ruff~=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration test marker",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".agents"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
