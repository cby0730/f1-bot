repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  # 1. Ruff: Run linting, formatting, and enable Security (S) rule set
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # 2. Gitleaks: Prevent API Tokens and secrets from being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # 3. Hadolint: Lint Dockerfile for security and best practices
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint

  # 4. pip-audit (SCA): Check for dependency vulnerabilities only when dependency files change
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (SCA)
        entry: uv run pip-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
